{% extends 'base.html' %}{% block content %}<div class='container py-5' style='max-width:760px'><div class='card p-4'><h2 class='fw-bold'>Index a manual</h2><p class='text-secondary'>Only administrators can add to the evidence corpus. Each PDF page is preserved for citation.</p><form method='post' enctype='multipart/form-data'>{% csrf_token %}<label class='form-label'>Machine</label><select name='machine' class='form-select mb-3'>{% for m in machines %}<option value='{{m.id}}'>{{m.machine_id}} · {{m.model}}</option>{% endfor %}</select><div class='row'><div class='col-md-6'><input name='document_id' class='form-control mb-3' placeholder='Document ID' required></div><div class='col-md-6'><input name='revision' class='form-control mb-3' placeholder='Revision' value='1.0'></div></div><input name='title' class='form-control mb-3' placeholder='Manual title' required><input name='pdf' type='file' accept='application/pdf' class='form-control mb-3' required><button class='btn btn-primary'>Extract and index PDF</button></form></div></div>{% endblock %}
